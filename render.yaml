services:
  - type: web
    name: mhrd-dashboard
    env: python
    buildCommand: |-
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput || echo "WARNING: migrate failed, continuing startup"
    startCommand: gunicorn mhrd_dashboard.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DJANGO_SETTINGS_MODULE
        value: "mhrd_dashboard.settings"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 2
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /api/v1/health
